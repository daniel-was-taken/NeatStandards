name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Install Xet (Manual Install)
      # --------------------------------------------------
      - name: Install Xet
        run: |
          # Download the latest release
          curl -L -o git-xet.tar.gz https://github.com/xetdata/xet-tools/releases/latest/download/xet-linux-x86_64.tar.gz
          
          # Extract to /usr/local/bin (requires sudo)
          sudo tar -xzf git-xet.tar.gz -C /usr/local/bin/
          
          # Verify installation
          which git-xet
          git-xet --version
          
          # Configure git-xet
          git xet install

      # --------------------------------------------------
      # Authenticate Xet with Hugging Face
      # --------------------------------------------------
      - name: Login to Xet (Hugging Face)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git xet login --user "daniel-was-taken" --email "actions@github.com" --password "$HF_TOKEN"

      # --------------------------------------------------
      # Git configuration
      # --------------------------------------------------
      - name: Configure Git User
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # --------------------------------------------------
      # Add Hugging Face remote
      # --------------------------------------------------
      - name: Add Hugging Face remote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://daniel-was-taken:$HF_TOKEN@huggingface.co/spaces/daniel-was-taken/CompifAI.git

      # --------------------------------------------------
      # Pull from Hugging Face (safe merge)
      # --------------------------------------------------
      - name: Pull from Hugging Face
        run: |
          git pull hf main --allow-unrelated-histories --no-rebase

      # --------------------------------------------------
      # Push to Hugging Face (Xet handles binaries)
      # --------------------------------------------------
      - name: Push to Hugging Face
        run: |
          git push hf main
